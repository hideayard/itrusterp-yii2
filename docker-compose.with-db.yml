# ============================================================================
#  OPSIONAL — API Yii2 + MySQL 8.0 (service `db` sendiri)
#
#  Pakai berkas ini HANYA bila memang mau menjalankan container MySQL baru.
#  Untuk memakai MySQL yang sudah ada, gunakan docker-compose.yml (default).
#
#  Jalankan:  docker compose -f docker-compose.with-db.yml up -d --build
#  API      :  http://localhost:8888/admin/api/v1
#  MySQL    :  127.0.0.1:3307  (db: erp, user: itrust / itrust_password)
# ============================================================================

name: itrust-erp-db

services:
  db:
    image: mysql:8.0
    container_name: itrust-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Aktifkan hanya bila ada klien PHP lama yang belum mendukung caching_sha2:
      # - --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-erp}
      MYSQL_USER: ${MYSQL_USER:-itrust}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-itrust_password}
      MYSQL_MAJOR: "8.0"
      TZ: Asia/Jakarta
    ports:
      # Sesuaikan bila 3307 sudah dipakai container MySQL yang lain.
      - "127.0.0.1:3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Semua *.sql / *.sh di folder ini diimpor OTOMATIS saat volume masih kosong
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build: .
    image: itrusterp-yii2:latest
    container_name: itrust-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8888:80"
    environment:
      YII_ENV: ${YII_ENV:-prod}
      YII_DEBUG: "false"

      # Nama service `db` otomatis jadi hostname di network compose
      AUREUS_DB_HOST: db
      AUREUS_DB_PORT: "3306"
      AUREUS_DB: ${MYSQL_DATABASE:-erp}
      AUREUS_DB_USER: ${MYSQL_USER:-itrust}
      AUREUS_DB_PASSWORD: ${MYSQL_PASSWORD:-itrust_password}

      AUREUS_CORS_ORIGINS: ${AUREUS_CORS_ORIGINS:-https://itrust-erp.pages.dev,https://erp.rimondaglobaldigital.com,http://localhost:4321}
      AUREUS_TOKEN_TTL_DAYS: "90"
      TZ: Asia/Jakarta
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/admin/api/v1 >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
