# ============================================================================
#  OPSIONAL — API Yii2 + MySQL 8.0 (service `db` sendiri)
#
#  Pakai berkas ini HANYA bila memang mau menjalankan container MySQL baru.
#  Untuk memakai MySQL yang sudah ada, gunakan docker-compose.yml (default).
#
#  Env terpisah:
#      docker/env/api.env   → container API
#      docker/env/db.env    → container MySQL
#
#  Jalankan:  docker compose -f docker-compose.with-db.yml up -d --build
#  API      :  http://localhost:8888/admin/api/v1
#  MySQL    :  127.0.0.1:3307
# ============================================================================

name: itrust-erp-db

services:
  db:
    image: mysql:8.0
    container_name: itrust-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Aktifkan hanya bila ada klien PHP lama yang belum mendukung caching_sha2:
      # - --default-authentication-plugin=mysql_native_password
    env_file:
      - ./docker/env/db.env
    ports:
      # Sesuaikan bila 3307 sudah dipakai container MySQL yang lain.
      - "127.0.0.1:3307:3306"
    volumes:
      - db_data:/var/lib/mysql
      # Semua *.sql / *.sh di folder ini diimpor OTOMATIS saat volume masih kosong
      - ./docker/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build: .
    image: itrusterp-yii2:latest
    container_name: itrust-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - ./docker/env/api.env
    environment:
      # Menimpa env_file: arahkan ke service `db` di network compose.
      AUREUS_DB_HOST: db
      AUREUS_DB_PORT: "3306"
    ports:
      - "8888:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/admin/api/v1 >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  db_data:
