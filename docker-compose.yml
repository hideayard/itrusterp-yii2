# ============================================================================
#  iTrustERP — API Yii2 (Docker) memakai MySQL container yang SUDAH ADA
#
#  Tidak ada service database di berkas ini: MySQL tetap di container yang sudah
#  jalan (contoh: mysql-itrust, publish 0.0.0.0:3307->3306).
#
#  Jalankan:  docker compose up -d --build
#  API      :  http://localhost:8888/admin/api/v1
#  MySQL    :  host.docker.internal:3307  (db: erp, user: itrust / itrust_password)
#
#  Kredensial bisa dioverride lewat berkas .env (compose membaca .env otomatis
#  untuk substitusi ${...}).
# ============================================================================

name: itrust-erp

services:
  api:
    build: .
    image: itrusterp-yii2:latest
    container_name: itrust-api
    restart: unless-stopped
    ports:
      # host:container → API di http://localhost:8888
      - "8888:80"
    environment:
      YII_ENV: ${YII_ENV:-prod}
      YII_DEBUG: "false"

      # host.docker.internal = mesin host (Mint). 3307 = port publish container MySQL.
      AUREUS_DB_HOST: ${AUREUS_DB_HOST:-host.docker.internal}
      AUREUS_DB_PORT: ${AUREUS_DB_PORT:-3307}
      AUREUS_DB: ${MYSQL_DATABASE:-erp}
      AUREUS_DB_USER: ${MYSQL_USER:-itrust}
      AUREUS_DB_PASSWORD: ${MYSQL_PASSWORD:-itrust_password}

      AUREUS_CORS_ORIGINS: ${AUREUS_CORS_ORIGINS:-https://itrust-erp.pages.dev,https://erp.rimondaglobaldigital.com,http://localhost:4321}
      AUREUS_TOKEN_TTL_DAYS: "90"
      TZ: Asia/Jakarta
    extra_hosts:
      # Wajib di Linux agar host.docker.internal bisa di-resolve
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/admin/api/v1 >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

#  Alternatif: gabung ke network milik container MySQL lalu pakai nama container
#  sebagai host (tanpa host gateway).
#    docker inspect mysql-itrust --format '{{json .NetworkSettings.Networks}}'
#
#  networks:
#    default:
#      external: true
#      name: <nama-network-mysql>
#
#  lalu set AUREUS_DB_HOST=mysql-itrust dan AUREUS_DB_PORT=3306.
#
#  Ingin DB dijalankan Docker juga? Pakai docker-compose.with-db.yml.
