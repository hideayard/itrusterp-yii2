# ============================================================================
#  iTrustERP — API Yii2 (Docker)
#
#  Konfigurasi container diambil dari:  docker/env/api.env
#  MySQL TIDAK dijalankan di sini. Dua pilihan:
#
#    A) MySQL dari docker/mysql/docker-compose.yml  (dipakai sebagai default)
#       → jalankan dulu:  docker compose -f docker/mysql/docker-compose.yml up -d
#       → di docker/env/api.env: AUREUS_DB_HOST=mysql , AUREUS_DB_PORT=3306
#
#    B) MySQL sudah jalan sebagai container lain dengan network sendiri
#       → set nama network-nya lewat berkas .env di folder ini:
#             DB_NETWORK=mysql_mysql-network
#         lalu sesuaikan AUREUS_DB_HOST/PORT di docker/env/api.env.
#
#  Jalankan:  docker compose up -d --build
#  API      :  http://localhost:8888/admin/api/v1
# ============================================================================

name: itrust-erp

networks:
  default:
    # Network ini dibuat oleh docker/mysql/docker-compose.yml (nama sama di sana).
    # Bisa dioverride lewat .env → DB_NETWORK=<nama-network-mysql>
    external: true
    name: ${DB_NETWORK:-itrust-db-network}

services:
  api:
    build: .
    image: itrusterp-yii2:latest
    container_name: itrust-api
    restart: unless-stopped
    env_file:
      - ./docker/env/api.env
    ports:
      - "8888:80"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/admin/api/v1 >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

#  Catatan:
#  - Kalau muncul "network ... declared as external, but could not be found":
#    jalankan dulu compose MySQL-nya (docker/mysql/docker-compose.yml), atau
#    buat manual:  docker network create itrust-db-network
#  - `docker compose down` di folder docker/mysql menghapus network itu; pakai
#    `docker compose ... stop` bila ingin network tetap ada.
#  - Alternatif tanpa network bersama: publish MySQL ke semua antarmuka
#    ("3307:3306" di docker/mysql/docker-compose.yml), tambahkan
#       extra_hosts: ["host.docker.internal:host-gateway"]
#    di sini, dan set AUREUS_DB_HOST=host.docker.internal , AUREUS_DB_PORT=3307.
