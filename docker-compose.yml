# docker-compose.yml
name: itrust-erp

networks:
  default:
    external: true
    name: mysql_mysql-network

services:
  api:
    build: .
    image: itrusterp-yii2:latest
    container_name: itrust-api
    restart: unless-stopped
    env_file:
      - ./docker/env/api.env
    ports:
      - "8888:80"
    # extra_hosts TIDAK diperlukan lagi
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/admin/api/v1 >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
