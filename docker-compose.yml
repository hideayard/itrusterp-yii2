# API iTrustERP (Yii2) di Docker.
# MySQL TIDAK dijalankan di sini — memakai container MySQL yang sudah ada
# (contoh: mysql-itrust, port host 3307 -> 3306).

services:
  api:
    build: .
    image: itrusterp-yii2:latest
    container_name: itrust-api
    restart: unless-stopped
    ports:
      # host:container  → API di http://localhost:8899
      - "8899:80"
    environment:
      YII_ENV: prod
      YII_DEBUG: "false"

      # host.docker.internal = mesin host (Mint). 3307 = port publish container MySQL.
      AUREUS_DB_HOST: host.docker.internal
      AUREUS_DB_PORT: "3307"
      AUREUS_DB: aureuserp
      AUREUS_DB_USER: itrust
      AUREUS_DB_PASSWORD: ganti-password

      AUREUS_CORS_ORIGINS: "https://itrust-erp.pages.dev,http://localhost:4321"
      AUREUS_TOKEN_TTL_DAYS: "90"
    extra_hosts:
      # Wajib di Linux agar host.docker.internal bisa di-resolve
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1/admin/api/v1 >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Alternatif: memakai container MySQL langsung lewat nama container (tanpa host gateway).
#   docker inspect mysql-itrust --format '{{json .NetworkSettings.Networks}}'
# lalu tambahkan:
#
# networks:
#   default:
#     external: true
#     name: <nama-network-mysql>
#
# dan set AUREUS_DB_HOST: mysql-itrust , AUREUS_DB_PORT: "3306".
