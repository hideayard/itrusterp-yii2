# ============================================================================
#  MySQL 8.0 untuk iTrustERP — dijalankan sendiri (tanpa container API)
#
#  Cara pakai:
#      cp docker/env/db.env.example docker/env/db.env      # sesuaikan kredensial
#      docker compose -f docker/mysql/docker-compose.yml up -d
#
#  Akses:
#      dari host           → 127.0.0.1:3307   (mis. DBeaver/TablePlus)
#      dari container lain → host `mysql` (network itrust-db-network)
#                            atau  host.docker.internal:3307 (host gateway)
#
#  Data      : named volume `itrust-mysql_db_data` (lihat `docker volume ls`)
#  Init dump : docker/mysql/init/*.sql  (dijalankan otomatis saat data masih kosong)
#  Stop      : docker compose -f docker/mysql/docker-compose.yml down
# ============================================================================

name: itrust-mysql

services:
  mysql:
    image: mysql:8.0
    container_name: itrust-db
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # Aktifkan hanya bila ada klien lama yang belum mendukung caching_sha2:
      # - --default-authentication-plugin=mysql_native_password
    # Kredensial: MYSQL_ROOT_PASSWORD, MYSQL_DATABASE, MYSQL_USER, MYSQL_PASSWORD, TZ
    env_file:
      - ../env/db.env
    ports:
      # host:container — hanya listen di loopback host
      - "127.0.0.1:3307:3306"
    volumes:
      # Named volume: berada di filesystem Linux (ext4), stabil untuk InnoDB.
      # JANGAN pakai folder di /mnt/c atau /mnt/e (DrvFs Windows) — MySQL butuh
      # chown/O_DIRECT yang tidak didukung di sana (datadir bisa gagal/corrupt).
      # Kalau tetap ingin folder fisik, arahkan ke ext4, mis.:
      #   - /home/<user>/mysql-data:/var/lib/mysql
      - db_data:/var/lib/mysql
      # *.sql / *.sh di sini diimpor otomatis saat volume masih kosong
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    networks:
      default:
        # alias tetap `mysql` supaya container lain bisa memakai AUREUS_DB_HOST=mysql
        aliases:
          - mysql
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    # Nama network dipakai bersama container API (lihat docker-compose.yml root).
    # Bisa dioverride lewat .env → DB_NETWORK=<nama-network>
    name: ${DB_NETWORK:-itrust-db-network}

volumes:
  # Data MySQL (nama nyata: itrust-mysql_db_data)
  db_data:

# ---------------------------------------------------------------------------
# Kalau muncul error iptables saat membuat network, mis.:
#   "Failed to Setup IP tables: Unable to enable ACCEPT OUTGOING rule ...
#    iptables: No chain/target/match by that name"
# itu masalah Docker daemon di host, bukan berkas ini. Perbaikan tersering:
#   sudo systemctl restart docker
# lalu ulangi `docker compose ... up -d`.
#
# Bila tetap gagal, pakai mode host: MySQL listen langsung di host (port 3306),
# tanpa bridge/iptables baru. Ganti blok ports/networks di atas dengan:
#   network_mode: host
# lalu set di docker/env/api.env → AUREUS_DB_HOST=127.0.0.1 , AUREUS_DB_PORT=3306
# (dari container lain: host.docker.internal:3306).
# ---------------------------------------------------------------------------

# Catatan:
# - Data disimpan di named volume `itrust-mysql_db_data` (filesystem Linux). Lihat/hapus:
#       docker volume ls | grep db_data
#       docker volume rm itrust-mysql_db_data     # hapus = database hilang (dijalankan saat container berhenti)
# - Jangan arahkan datadir ke /mnt/c atau /mnt/e (DrvFs) — MySQL bisa gagal start/corrupt.
#   Kalau perlu folder fisik, pakai path ext4: /home/<user>/mysql-data:/var/lib/mysql
# - Port 3307 bentrok bila ada MySQL lain (mis. container `mysql-itrust`).
#   Hentikan dulu atau ubah menjadi "127.0.0.1:3308:3306".
# - Database `erp` + user dibuat otomatis dari MYSQL_DATABASE/MYSQL_USER hanya saat
#   volume masih kosong (pertama kali). Kalau sudah terisi, isi `db.env` diabaikan.
